name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Install
        working-directory: apps/api
        run: uv sync --all-extras
      - name: Lint
        working-directory: apps/api
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        working-directory: apps/api
        run: uv run mypy src
      - name: Tests
        working-directory: apps/api
        run: uv run pytest -q
      - name: Evaluations (mock provider)
        working-directory: apps/api
        run: uv run bearcase eval
      - name: Fixtures are reproducible
        working-directory: apps/api
        run: uv run bearcase generate-fixtures --out /tmp/fx && python3 -c "import json,sys; a=json.load(open('/tmp/fx/northstar-ground-truth.json')); b=json.load(open('../../fixtures/northstar-hvac/northstar-ground-truth.json')); sys.exit(0 if a==b else 'ground truth drifted from generator')"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        run: npm ci --no-fund --no-audit --legacy-peer-deps
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npx tsc --noEmit
      - working-directory: apps/web
        run: npm run test
      - working-directory: apps/web
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: uv python install 3.12
      - working-directory: apps/api
        run: uv sync --all-extras
      - working-directory: apps/web
        run: npm ci --no-fund --no-audit --legacy-peer-deps && npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npx playwright test
