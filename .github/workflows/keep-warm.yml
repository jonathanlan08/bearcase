# Keeps the Render free-tier API awake. Render spins a free web service down after 15 idle minutes and the next
# visitor waits about a minute for it to boot; a ping every 10 minutes prevents that. It hits /api/ping, which never
# touches the database, so the Neon database can still scale to zero between real visits.
# One always-on free service uses about 744 of Render's 750 free instance hours a month.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it from the Actions tab.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl -fsS --retry 2 --max-time 90 https://bearcase-api.onrender.com/api/ping
